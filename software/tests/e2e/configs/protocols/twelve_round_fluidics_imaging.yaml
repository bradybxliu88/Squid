name: "12-Round Fluidics Imaging (Real Hardware)"
version: "3.0"
description: "Twelve sequential probe-delivery rounds with imaging between each round, using real MERFISH fluidics hardware."
output_directory: D:/brady/new_software/outputs

resources:
  fluidics_protocols_file: C:/Users/CZC4457GCG/Desktop/Will/Squid_BL/software/merfish_config/water_run_fluidics_protocols.yaml
